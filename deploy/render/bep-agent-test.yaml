services:
  - type: web
    name: bep-gemini-agent-test-api
    runtime: node
    region: frankfurt
    plan: free
    branch: feat/bep-gemini-agent-v1-20261114
    autoDeploy: false
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bep-test-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://bep-agent-test.invalid
      - key: BEP_AGENT_ENABLED
        value: "false"
      - key: BEP_AGENT_ZERO_BILLING_CONFIRMED
        value: "false"
