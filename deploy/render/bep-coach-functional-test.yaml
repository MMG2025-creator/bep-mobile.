services:
  - type: web
    name: bep-coach-functional-test-api
    runtime: node
    region: frankfurt
    plan: free
    branch: test/bep-coach-functional-20261114
    autoDeploy: false
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bep-test-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://bep-coach-functional-test.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: BEP_TEST_MODE
        value: "true"
      - key: BEP_TEST_BOOTSTRAP_TOKEN
        generateValue: true
      - key: BEP_AGENT_ENABLED
        value: "false"
      - key: BEP_AGENT_ZERO_BILLING_CONFIRMED
        value: "false"
      - key: BEP_AGENT_SCHEMA_MIGRATE
        value: "false"
