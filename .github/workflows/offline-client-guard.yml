name: BEP offline client regression guard

on:
  pull_request:
    branches: [main]
    paths:
      - "app.js"
      - "dist/app.js"
      - "offline-storage.js"
      - "dist/offline-storage.js"
      - "monthly-budget-ui.js"
      - "dist/monthly-budget-ui.js"
      - "tests/offline-first.test.js"
      - ".github/workflows/offline-client-guard.yml"
  push:
    branches: [fix/trusted-offline-client-release-20261113]
    paths:
      - "app.js"
      - "dist/app.js"
      - "offline-storage.js"
      - "dist/offline-storage.js"
      - "monthly-budget-ui.js"
      - "dist/monthly-budget-ui.js"
      - "tests/offline-first.test.js"
      - ".github/workflows/offline-client-guard.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bep_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bep_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-fund
      - run: node --check app.js
      - run: node --check offline-storage.js
      - run: node --check monthly-budget-ui.js
      - run: node --test tests/offline-first.test.js
      - run: node --test tests/monthly-budget.test.js tests/monthly-budget.integration.test.js tests/offline-first.test.js
