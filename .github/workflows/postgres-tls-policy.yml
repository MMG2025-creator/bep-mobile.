name: PostgreSQL TLS policy tests

on:
  push:
    branches: [security/postgres-tls-hardening-stack-20261120]
  pull_request:

jobs:
  postgres-tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run PostgreSQL TLS policy tests
        run: node --test tests/bep-postgres-ssl.test.js
