name: Monthly budget history checks

on:
  pull_request:
    branches: [main]
    paths:
      - "server.js"
      - "monthly-budget-routes.js"
      - "monthly-budget-ui.js"
      - "database/migrations/**"
      - "tests/monthly-budget*.test.js"
      - "package.json"
      - ".github/workflows/monthly-budget.yml"
  push:
    branches: [feature/monthly-budget-history]
    paths:
      - "server.js"
      - "monthly-budget-routes.js"
      - "monthly-budget-ui.js"
      - "database/migrations/**"
      - "tests/monthly-budget*.test.js"
      - "package.json"
      - ".github/workflows/monthly-budget.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bep_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bep_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run check:monthly-budget
