name: Monthly budget history checks

concurrency:
  group: monthly-budget-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "server.js"
      - "lib/bep-financial-*.js"
      - "tests/bep-financial-intelligence.test.js"
      - "monthly-budget-routes.js"
      - "monthly-budget-ui.js"
      - "app.js"
      - "dist/**"
      - "index.html"
      - "styles.css"
      - "database/migrations/**"
      - "tests/monthly-budget*.test.js"
      - "package.json"
      - "docs/**"
      - ".github/workflows/monthly-budget.yml"
  push:
    branches: [feature/monthly-budget-history, feature/financial-intelligence-mainline]
    paths:
      - "server.js"
      - "monthly-budget-routes.js"
      - "monthly-budget-ui.js"
      - "app.js"
      - "dist/**"
      - "index.html"
      - "styles.css"
      - "database/migrations/**"
      - "tests/**"
      - "package.json"
      - "docs/**"
      - ".github/workflows/monthly-budget.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bep_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bep_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-fund
      - run: npm audit --omit=dev
      - run: cmp -s app.js dist/app.js
      - run: node --check server.js
      - name: Verify frontend entrypoint asset references
        run: |
          for file in index.html dist/index.html; do
            grep -Fq './runtime-config.js?v=1' "$file"
            grep -Fq './app.js?v=97' "$file"
            if [ -f spend-experience.js ]; then
              grep -Fq './spend-experience.css?v=5' "$file"
              grep -Fq './spend-experience.js?v=5' "$file"
            fi
          done
      - run: npm run check:monthly-budget
