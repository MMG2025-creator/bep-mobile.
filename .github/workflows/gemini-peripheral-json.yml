name: BEP Gemini peripheral JSON service checks

on:
  push:
    branches: [feature/gemini-peripheral-json-service-v1]
    paths:
      - "services/gemini-agent/**"
      - "lib/bep-coach-snapshot-exporter.js"
      - "scripts/export-bep-coach-snapshots.js"
      - "tests/bep-coach-snapshot-exporter.test.js"
      - "src/coach/knowledge/financialCoachKnowledge.fr.js"
      - "src/coach/knowledge/coachRegressionCases.fr.json"
      - ".github/workflows/gemini-peripheral-json.yml"
  pull_request:
    paths:
      - "services/gemini-agent/**"
      - "lib/bep-coach-snapshot-exporter.js"
      - "scripts/export-bep-coach-snapshots.js"
      - "tests/bep-coach-snapshot-exporter.test.js"
      - "src/coach/knowledge/financialCoachKnowledge.fr.js"
      - "src/coach/knowledge/coachRegressionCases.fr.json"

jobs:
  validate-read-only-exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax checks
        run: |
          node --check lib/bep-coach-snapshot-exporter.js
          node --check scripts/export-bep-coach-snapshots.js
          node --check services/gemini-agent/server.js
      - name: Unit tests (no database connection)
        run: node --test tests/bep-coach-snapshot-exporter.test.js
      - name: Verify Gemini service has no database integration
        run: |
          if grep -R -nE 'require\(["\x27]pg["\x27]\)|DATABASE_URL|BEP_KNOWLEDGE_READONLY_DATABASE_URL' services/gemini-agent; then
            echo "Database integration or credentials found in Gemini service"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('services/gemini-agent/package.json', 'utf8'));
          if (p.scripts.prestart) throw new Error('Gemini startup must not regenerate placeholder snapshots');
          if (!p.scripts.start) throw new Error('Missing service start command');
          NODE
