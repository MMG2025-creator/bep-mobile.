name: BEP production k6 load test

on:
  push:
    branches:
      - test/k6-production-load-20261115
    paths:
      - tests/load/k6-production.js
      - .github/workflows/k6-production-load.yml

permissions:
  contents: read

concurrency:
  group: bep-production-k6-load-test
  cancel-in-progress: false

jobs:
  production-load-test:
    name: Guarded production load test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout test scenario
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.54.0'

      - name: Run guarded production test
        env:
          K6_WEB_URL: https://bep-mobile.onrender.com
          K6_API_URL: https://bep-v2-api.onrender.com
        run: |
          k6 run --summary-export=k6-summary-export.json tests/load/k6-production.js

      - name: Publish concise test report
        if: always()
        run: |
          if [ -f k6-summary.json ]; then
            node - <<'NODE'
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('k6-summary.json', 'utf8'));
            const m = d.metrics || {};
            const v = (name, key) => m[name]?.values?.[key] ?? 'n/a';
            const lines = [
              '## BEP production k6 load test',
              '',
              '| Metric | Result |',
              '|---|---:|',
              '| Requests | ' + v('http_reqs', 'count') + ' |',
              '| Failed requests | ' + (v('http_req_failed', 'rate') === 'n/a' ? 'n/a' : (v('http_req_failed', 'rate') * 100).toFixed(2) + '%') + ' |',
              '| p50 | ' + v('http_req_duration', 'med') + ' ms |',
              '| p95 | ' + v('http_req_duration', 'p(95)') + ' ms |',
              '| p99 | ' + v('http_req_duration', 'p(99)') + ' ms |',
              '| Max VUs | ' + v('vus', 'max') + ' |',
              '',
              'Scenario: 20 initial virtual users, +2 every 2 minutes to 50, then 5-minute hold.',
              'Each virtual user sends 10 read-only GET requests across an approximately 5-minute session.',
              'Scope: public frontend assets, /api/health and unauthenticated /api/auth/status. No financial writes or authenticated user data.'
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            NODE
          else
            echo '## BEP production k6 load test' >> "$GITHUB_STEP_SUMMARY"
            echo 'No k6 summary was produced. Check the runner logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload k6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bep-production-k6-report
          path: |
            k6-summary.json
            k6-summary-export.json
          if-no-files-found: warn
          retention-days: 14
