name: Coach external AI consent checks

on:
  pull_request:
    branches: [main, fix/coach-external-ai-consent-gate-20261113]
    paths:
      - "server.js"
      - "app.js"
      - "dist/app.js"
      - "index.html"
      - "dist/index.html"
      - "settings.css"
      - "dist/settings.css"
      - "styles.css"
      - "dist/styles.css"
      - "tests/frontend-integration.test.js"
      - "tests/bep-ai-consent.test.js"
      - ".github/workflows/coach-ai-consent.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bep_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bep_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-fund
      - name: Check source and published assets
        run: |
          node --check server.js
          node --check app.js
          node --check dist/app.js
          cmp -s app.js dist/app.js
      - name: Test account consent and frontend controls
        run: node --test tests/bep-ai-consent.test.js
      - name: Test offline and synchronization regressions
        run: node --test tests/offline-first.test.js tests/offline-sync-api.test.js
      - name: Run full BEP regression suite
        run: npm run check:monthly-budget
