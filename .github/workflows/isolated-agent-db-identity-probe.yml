name: Isolated agent DB identity probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run isolated read-only identity probe
        env:
          BEP_AGENT_DATABASE_URL: ${{ secrets.BEP_AGENT_DATABASE_URL }}
        run: node scripts/probe-agent-db-identity.js
