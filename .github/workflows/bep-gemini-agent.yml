name: BEP Gemini Agent isolated checks

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/bep-agent/**"
      - "database/migrations/20261114_bep_gemini_agent.sql"
      - "tests/bep-agent.test.js"
      - "tests/bep-agent-db.test.js"
      - "docs/BEP_GEMINI_AGENT_*.md"
      - ".github/workflows/bep-gemini-agent.yml"
      - "server.js"
  push:
    branches: [integration/v1.3-baseline-20261114]
    paths:
      - "lib/bep-agent/**"
      - "database/migrations/20261114_bep_gemini_agent.sql"
      - "tests/bep-agent.test.js"
      - "tests/bep-agent-db.test.js"
      - "docs/BEP_GEMINI_AGENT_*.md"
      - ".github/workflows/bep-gemini-agent.yml"
      - "server.js"

jobs:
  validate-agent:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bep_agent_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bep_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bep_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax checks
        run: |
          node --check lib/bep-agent/config.js
          node --check lib/bep-agent/gemini-client.js
          node --check lib/bep-agent/repository.js
          node --check lib/bep-agent/worker.js
          node --check lib/bep-agent/index.js
          node --check server.js
      - name: Install dependencies for PostgreSQL integration tests
        run: npm install --no-fund
      - name: Agent safety tests
        run: node --test tests/bep-agent.test.js tests/bep-agent-db.test.js tests/bep-financial-intelligence.test.js tests/offline-first.test.js tests/offline-sync-api.test.js
