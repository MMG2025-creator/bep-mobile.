name: BEP Admin isolated validation

on:
  push:
    branches: [feature/bep-admin-json-console-20261115]
  pull_request:
    branches: [deployment-test/BEP-v1.6-pre-prod-v2-20261114]

jobs:
  admin-validation:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bep_admin_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bep_admin_test
      SESSION_SECRET: ci-only-session-secret-not-for-production
      BEP_ADMIN_EXCHANGE_SECRET: ci-only-exchange-secret-not-for-production
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bep_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bep_admin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-fund
      - name: Syntax validation
        run: node --check server.js && node --check admin/bep-admin.js
      - name: BEP Admin unit tests
        run: node --test tests/bep-admin.test.js
      - name: Full regression suite
        run: npm test
