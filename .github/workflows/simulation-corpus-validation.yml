name: Simulation corpus validation
on:
  pull_request:
    branches:
      - deployment-test/BEP-v1.6-pre-prod-v2-20261114
    paths:
      - "scripts/seed-coach-simulation.js"
      - "lib/bep-agent/worker.js"
      - "database/migrations/20261114_bep_coach_simulation.sql"
      - "package.json"
      - ".github/workflows/simulation-corpus-validation.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check scripts/seed-coach-simulation.js
      - run: node --check lib/bep-agent/worker.js
      - run: npm test
