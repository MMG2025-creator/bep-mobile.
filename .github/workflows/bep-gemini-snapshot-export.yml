name: BEP controlled Gemini snapshot export

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bep-gemini-snapshot-export
  cancel-in-progress: false

jobs:
  export-approved-snapshots:
    if: github.ref == 'refs/heads/feature/gemini-peripheral-json-service-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dedicated BEP branch
        uses: actions/checkout@v4
        with:
          ref: feature/gemini-peripheral-json-service-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies without lifecycle scripts or lockfile changes
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Verify exporter database role (read-only catalog checks)
        env:
          BEP_KNOWLEDGE_READONLY_DATABASE_URL: ${{ secrets.BEP_KNOWLEDGE_READONLY_DATABASE_URL }}
        run: |
          test -n "$BEP_KNOWLEDGE_READONLY_DATABASE_URL" || {
            echo "::error::GitHub secret BEP_KNOWLEDGE_READONLY_DATABASE_URL is not configured."
            exit 2
          }
          npm run check:coach-exporter-role

      - name: Export and validate approved shared snapshots
        env:
          BEP_KNOWLEDGE_READONLY_DATABASE_URL: ${{ secrets.BEP_KNOWLEDGE_READONLY_DATABASE_URL }}
          GIT_SHA: ${{ github.sha }}
        run: npm run export:coach-snapshots

      - name: Commit only the two generated JSON snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- services/gemini-agent/data/knowledge-bep-coach.json services/gemini-agent/data/reasoning-bep-coach.json
          if git diff --cached --quiet; then
            echo "Snapshots are unchanged; no commit is required."
            exit 0
          fi
          git commit -m "chore(gemini): publish validated BEP snapshots"
          git push origin HEAD:feature/gemini-peripheral-json-service-v1
