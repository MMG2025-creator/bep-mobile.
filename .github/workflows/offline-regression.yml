name: BEP offline regression
on:
  push:
    branches:
      - work/offline-phase4-20261113
      - test/budget-revenus-charges-liste
  pull_request:
    branches:
      - test/budget-revenus-charges-liste
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check:monthly-budget
