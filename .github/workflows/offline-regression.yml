name: BEP offline regression
on:
  push:
    branches:
      - work/offline-phase4-rebased-20261113
      - work/offline-phase4-canonical-20261113
      - work/offline-conflict-ui-20261113
      - test/budget-revenus-charges-liste
  pull_request:
    branches:
      - test/budget-revenus-charges-liste
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check offline-storage.js && node --check dist/offline-storage.js && node --check monthly-budget-ui.js && node --check dist/monthly-budget-ui.js && node --check sw.js && node --check dist/sw.js
      - run: node --test tests/offline-first.test.js tests/offline-sync-runtime.test.js tests/offline-monthly-budget.test.js
